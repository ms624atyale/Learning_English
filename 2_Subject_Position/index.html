<html lang="en">

    :root {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --primary-navy: #1e293b;
      --accent-blue: #2563eb;
      --accent-light: #eff6ff;
      --text-dark: #334155;
      --text-muted: #64748b;
      --correct-bg: #dcfce7;
      --correct-border: #16a34a;
      --correct-text: #14532d;
      --incorrect-bg: #fee2e2;
      --incorrect-border: #dc2626;
      --incorrect-text: #7f1d1d;
      --border-color: #e2e8f0;
      --radius: 12px;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Lora', 'Cambria', Georgia, serif;
      background-color: var(--bg-color);
      color: var(--text-dark);
      line-height: 1.6;
      padding: 30px 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .quiz-container {
      background-color: var(--card-bg);
      max-width: 780px;
      width: 100%;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 35px 40px;
      border: 1px solid var(--border-color);
    }

    header {
      text-align: center;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 20px;
      margin-bottom: 25px;
    }

    header h1 {
      font-size: 1.8rem;
      color: var(--primary-navy);
      font-weight: 600;
      margin-bottom: 8px;
    }

    header p {
      font-family: 'Comic Neue', 'Nunito', sans-serif;
      font-size: 1.05rem;
      color: var(--text-muted);
    }

    /* Progress & Score Bar */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
      color: var(--text-muted);
      font-size: 0.95rem;
    }
